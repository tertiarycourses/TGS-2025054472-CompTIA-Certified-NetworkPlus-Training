# Lab 24 — WireGuard config for SITE-A (namespace: site-a)
#
# This is the same tunnel the README builds imperatively in Step 4, written in
# the declarative form a real site-to-site VPN uses (wg-quick / wg setconf).
#
# !!! NO REAL KEYS ARE IN THIS FILE !!!
# The two placeholders below MUST be replaced with keys you generate yourself in
# README Step 3.  ./setup.sh does this substitution for you automatically.
#
#   PrivateKey  <- the contents of /tmp/a.key   (site-a's own private key)
#   PublicKey   <- the contents of /tmp/b.pub   (site-b's public key)
#
# Apply it inside the namespace with:
#   ip netns exec site-a wg setconf wg0 /tmp/wg0-a.conf
#
# NEVER commit a real PrivateKey line to a repository.

[Interface]
# site-a's tunnel address (the README assigns this with `ip -n site-a addr add`)
Address    = 10.99.0.1/24
ListenPort = 51820
PrivateKey = <PASTE_SITE_A_PRIVATE_KEY_HERE>

[Peer]
# site-b
PublicKey  = <PASTE_SITE_B_PUBLIC_KEY_HERE>
# allowed-ips is both a routing rule and an inbound ACL: only 10.99.0.2 may
# arrive from, or be sent to, this peer.
AllowedIPs = 10.99.0.2/32

# Lab 24 — WireGuard config for SITE-B (namespace: site-b)
#
# This is the same tunnel the README builds imperatively in Step 4, written in
# the declarative form a real site-to-site VPN uses (wg-quick / wg setconf).
#
# !!! NO REAL KEYS ARE IN THIS FILE !!!
# The two placeholders below MUST be replaced with keys you generate yourself in
# README Step 3.  ./setup.sh does this substitution for you automatically.
#
#   PrivateKey  <- the contents of /tmp/b.key   (site-b's own private key)
#   PublicKey   <- the contents of /tmp/a.pub   (site-a's public key)
#
# Apply it inside the namespace with:
#   ip netns exec site-b wg setconf wg0 /tmp/wg0-b.conf
#
# NEVER commit a real PrivateKey line to a repository.

[Interface]
# site-b's tunnel address (the README assigns this with `ip -n site-b addr add`)
Address    = 10.99.0.2/24
ListenPort = 51821
PrivateKey = <PASTE_SITE_B_PRIVATE_KEY_HERE>

[Peer]
# site-a
PublicKey  = <PASTE_SITE_A_PUBLIC_KEY_HERE>
AllowedIPs = 10.99.0.1/32
# site-b is the initiator, so it needs the remote endpoint. Both namespaces share
# the host loopback here; in production this is the public IP of the remote site.
Endpoint   = 127.0.0.1:51820
# Keeps the tunnel warm through stateful NAT on the path.
PersistentKeepalive = 25

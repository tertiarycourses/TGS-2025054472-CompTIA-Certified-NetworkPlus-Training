# Lab 13 — ISC DHCP server scope for the dum0 test subnet.
# Install with:  cp dhcpd.conf /etc/dhcp/dhcpd.conf
#
# default-lease-time / max-lease-time are in seconds.
# "authoritative" tells this server it is the official DHCP server for the
# subnet, so it may send DHCPNAK to clients asking for a wrong address.

default-lease-time 600;
max-lease-time 7200;
authoritative;

subnet 10.50.0.0 netmask 255.255.255.0 {
  range 10.50.0.100 10.50.0.150;
  option routers 10.50.0.1;
  option subnet-mask 255.255.255.0;
  option domain-name-servers 1.1.1.1, 8.8.8.8;
  option broadcast-address 10.50.0.255;
}

# Lab 23 — hardened sshd configuration fragment.
#
# The README's Step 4 achieves the first two settings with sed. This file is the
# same hardening expressed as a drop-in fragment, which is how it is done on a
# real fleet (config management drops a file; it does not sed the vendor config).
#
# Install it with:
#   cp sshd_hardening.conf /etc/ssh/sshd_config.d/99-lab-hardening.conf
#   sshd -t && systemctl reload ssh
#
# Remove it again with ./cleanup.sh before the next lab.
#
# NOTE: this file contains NO keys and NO credentials. The Ed25519 key pair is
# generated on your own machine in Step 1.

# --- Step 4: the two changes the README makes with sed -----------------------
# Kill password guessing outright: only public keys are accepted.
PasswordAuthentication no
# root may log in, but only with a key — never with a password.
PermitRootLogin prohibit-password

# --- Step 6: the bonus hardening checklist, as real directives ---------------
# Non-standard port cuts the volume of automated scanning noise.
# (Commented out: changing it mid-lab would drop your Killercoda session.)
#Port 2222

# Limit who may authenticate at all.
#AllowUsers admin

# Three attempts per connection, then the connection is dropped.
MaxAuthTries 3

# Belt and braces — these are already implied by PasswordAuthentication no.
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Do not let a client forward ports or X11 unless the service needs it.
AllowTcpForwarding no
X11Forwarding no

# Drop idle sessions after 5 minutes (2 x 300s probes).
ClientAliveInterval 300
ClientAliveCountMax 2

# Fail fast on half-open connections.
LoginGraceTime 30

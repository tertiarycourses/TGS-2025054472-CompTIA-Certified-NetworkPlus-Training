# Lab 17 — rsyslog forwarding rule
#
# This is the file README Step 2 creates. Install it with:
#
#     cp 50-forward.conf /etc/rsyslog.d/50-forward.conf
#     systemctl restart rsyslog
#
# Selector `*.*`      — every facility, every severity.
# Target   `@@host:port` — double @@ means TCP (a single @ would mean UDP).
# On a real network the target is the central collector, not 127.0.0.1.

*.* @@127.0.0.1:514

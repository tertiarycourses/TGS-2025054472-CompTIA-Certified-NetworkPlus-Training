# Lab 22 — nginx TLS site config.
# This is the exact server block from README Step 3, as a real file.
#
# Install it with:
#   cp nginx-tls.conf /etc/nginx/sites-available/default
#   nginx -t && systemctl restart nginx

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/certs/lab.crt;
    ssl_certificate_key /etc/ssl/private/lab.key;
    root /var/www/html;
    index index.html;
}
